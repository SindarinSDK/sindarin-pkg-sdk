name: SDK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sindarin-pkg-test:
    uses: SindarinSDK/sindarin-pipelines/.github/workflows/sindarin-pkg-test.yml@main

  native-oracle-contract:
    name: Native text oracle contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify authored and Windows-checkout byte oracles
        run: python3 -m unittest discover -s tests/native -p 'test_*.py' -v

  canonical-time-date:
    name: Canonical Time/Date (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: ''
            sn_cc: gcc
            sn_cflags: ''
            sn_rustflags: ''
            exe_ext: ''
          - os: macos-latest
            rust_target: ''
            sn_cc: clang
            sn_cflags: ''
            sn_rustflags: ''
            exe_ext: ''
          - os: windows-latest
            rust_target: x86_64-pc-windows-gnullvm
            sn_cc: clang
            sn_cflags: --target=x86_64-w64-mingw32 -fuse-ld=lld -rtlib=compiler-rt -unwindlib=none
            sn_rustflags: --target=x86_64-pc-windows-gnullvm -C linker=clang
            exe_ext: .exe
    env:
      SN_CC: ${{ matrix.sn_cc }}
      SN_CFLAGS: ${{ matrix.sn_cflags }}
      SN_RUSTFLAGS: ${{ matrix.sn_rustflags }}
    steps:
      - name: Checkout accepted compiler
        uses: actions/checkout@v7
        with:
          repository: SindarinSDK/sindarin-compiler
          ref: 4211bf0f37b2941faa4534e349aabf46697ba907
          persist-credentials: false
      - name: Checkout exact SDK revision
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: sdk
          persist-credentials: false
      - name: Use accepted compiler toolchains and project dependencies
        uses: ./.github/actions/compiler-toolchain
        with:
          build_deps: 'true'
          rust_target: ${{ matrix.rust_target }}
      - name: Build accepted compiler
        shell: bash
        run: make build
      - name: Validate independent C/Rust archives and unchanged SDK callers
        shell: bash
        run: python3 sdk/scripts/check_time_date_native.py --compiler "bin/sn${{ matrix.exe_ext }}"
      - name: Validate DTLS teardown and retain original C caller streams
        shell: bash
        run: python3 sdk/scripts/check_dtls_lifecycle.py --compiler "bin/sn${{ matrix.exe_ext }}" --targets c
      - name: Validate UUID namespace credits and unchanged C/Rust callers
        shell: bash
        run: python3 sdk/scripts/check_uuid_credits.py --compiler "bin/sn${{ matrix.exe_ext }}"
      - name: Instrument UUID ownership and legacy callers
        if: runner.os == 'Linux'
        shell: bash
        env:
          SN_CC: gcc
          SN_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 sdk/scripts/check_uuid_credits.py --compiler bin/sn
      - name: Validate canonical Random and unchanged C/Rust callers
        shell: bash
        run: python3 sdk/scripts/check_random_native.py --compiler "bin/sn${{ matrix.exe_ext }}"
      - name: Instrument Random storage and actual shared runtime
        if: runner.os == 'Linux'
        shell: bash
        run: python3 sdk/scripts/check_random_native.py --compiler bin/sn --sanitize
      - name: Validate canonical UUID storage and unchanged C/Rust callers
        shell: bash
        run: python3 sdk/scripts/check_uuid_native.py --compiler "bin/sn${{ matrix.exe_ext }}"
      - name: Instrument UUID canonical storage and actual shared runtime
        if: runner.os == 'Linux'
        shell: bash
        run: python3 sdk/scripts/check_uuid_native.py --compiler bin/sn --sanitize
      - name: Validate canonical StringBuilder and unchanged C/Rust callers
        shell: bash
        run: python3 sdk/scripts/check_stringbuilder_native.py --compiler "bin/sn${{ matrix.exe_ext }}"
      - name: Instrument StringBuilder storage and actual shared runtime
        if: runner.os == 'Linux'
        shell: bash
        run: python3 sdk/scripts/check_stringbuilder_native.py --compiler bin/sn --sanitize
      - name: Validate canonical Process output capture and unchanged callers
        shell: bash
        run: python3 sdk/scripts/check_process_native.py --compiler "bin/sn${{ matrix.exe_ext }}"
      - name: Instrument Process storage and dual-pipe capture
        if: runner.os == 'Linux'
        shell: bash
        run: python3 sdk/scripts/check_process_native.py --compiler bin/sn --sanitize
      - name: Instrument canonical modules and actual shared runtime
        if: runner.os == 'Linux'
        shell: bash
        run: python3 sdk/scripts/check_time_date_native.py --compiler bin/sn --sanitize
      - name: Instrument DTLS listener teardown and actual runtime
        if: runner.os == 'Linux'
        shell: bash
        run: python3 sdk/scripts/check_dtls_lifecycle.py --compiler bin/sn --sanitize
      - name: Retain calendar ABI and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: time-date-native-${{ matrix.os }}
          path: |
            sdk/.sn/time-date-native.json
            sdk/.sn/time-date-sanitizers.json
            sdk/.sn/dtls-lifecycle.json
            sdk/.sn/dtls-lifecycle-sanitizers.json
            sdk/.sn/uuid-credit-validation.json
            sdk/.sn/uuid-credit-validation-sanitized.json
            sdk/.sn/random-native.json
            sdk/.sn/random-sanitizers.json
            sdk/.sn/uuid-native.json
            sdk/.sn/uuid-sanitizers.json
            sdk/.sn/stringbuilder-native.json
            sdk/.sn/stringbuilder-sanitizers.json
            sdk/.sn/process-native.json
            sdk/.sn/process-sanitizers.json
